services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ppi
      POSTGRES_PASSWORD: ppi_dev_password
      POSTGRES_DB: projectana
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppi -d projectana"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgresql://ppi:ppi_dev_password@postgres:5432/projectana
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://ppi:ppi_dev_password@postgres:5432/projectana
    depends_on:
      postgres:
        condition: service_healthy

  analytics:
    build:
      context: .
      dockerfile: apps/analytics/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ANALYTICS_DATABASE_URL: postgresql://analytics_reader:analytics_readonly@postgres:5432/projectana
      ANALYTICS_PORT: "8000"
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:4000
    depends_on:
      - api

volumes:
  pgdata:
